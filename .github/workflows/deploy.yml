# 打 tag 自动构建 H5 并部署到服务器
# 用法：git tag v0.1.0 && git push origin v0.1.0
name: deploy-h5

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: # 允许在 Actions 页面手动触发（用当前分支最新代码部署）

jobs:
  # 检测本次发布是否涉及服务端相关文件（对比上一个 tag）
  changes:
    runs-on: ubuntu-latest
    outputs:
      server: ${{ steps.filter.outputs.server }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: filter
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            # 手动触发时始终部署服务端，图个省心
            echo "server=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          PREV=$(git tag --sort=-creatordate | grep -v "^${GITHUB_REF_NAME}$" | head -1 || true)
          if [ -z "$PREV" ]; then
            CHANGED=$(git diff-tree --no-commit-id --name-only -r HEAD)
          else
            CHANGED=$(git diff --name-only "$PREV" HEAD)
          fi
          echo "本次变更文件："
          echo "$CHANGED"
          if echo "$CHANGED" | grep -qE '^(apps/server|packages/core)/|^package-lock\.json$'; then
            echo "server=true" >> "$GITHUB_OUTPUT"
          else
            echo "server=false" >> "$GITHUB_OUTPUT"
          fi

  build-deploy:
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - run: npm install

      # 音频不进 git，但内容是 words 数据决定的：词库没变就用缓存，不重新生成
      - name: 缓存已生成的音频
        uses: actions/cache@v4
        with:
          path: apps/h5/public/audio
          key: audio-${{ hashFiles('packages/core/src/data/*.ts') }}
          restore-keys: audio-

      - name: 生成缺失的音频
        run: |
          pip install -r scripts/requirements.txt
          npm run gen:audio

      - name: 构建 H5
        run: npm run build

      # 压缩包放仓库根目录：scp-action 会保留源路径的目录层级，
      # 用绝对路径会导致远端解到 /tmp/home/runner/... 下而找不到文件
      - name: 打包产物
        run: |
          tar -czf site.tgz -C apps/h5/dist .
          ls -lh site.tgz

      - name: 上传到服务器
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: site.tgz
          target: /tmp/

      - name: 解压到站点目录
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -e
            mkdir -p /var/www/html/english-study
            tar -xzf /tmp/site.tgz -C /var/www/html/english-study
            rm /tmp/site.tgz

  # 服务端部署：打包 apps/server + packages/core（@study/core 是 TS 源码包，线上用 tsx 运行）
  # 只在服务端相关文件变更时执行（手动触发时总是执行）
  deploy-server:
    needs: [changes, build-deploy]
    if: needs.changes.outputs.server == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 打包服务端（保留 monorepo 结构，服务器上按 workspaces 安装）
        run: |
          DEPLOY="$RUNNER_TEMP/server-deploy"
          mkdir -p "$DEPLOY/apps" "$DEPLOY/packages"
          cp -r apps/server "$DEPLOY/apps/server"
          cp -r packages/core "$DEPLOY/packages/core"
          rm -rf "$DEPLOY/apps/server/node_modules" "$DEPLOY/apps/server/data"
          echo '{"name":"english-study-server","private":true,"workspaces":["apps/server","packages/core"]}' > "$DEPLOY/package.json"
          tar -czf server.tgz -C "$DEPLOY" .
          ls -lh server.tgz

      - name: 上传到服务器
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: server.tgz
          target: /tmp/

      - name: 安装依赖并用 pm2 重启
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          command_timeout: 30m
          script: |
            set -e
            mkdir -p /var/www/english-study-server
            tar -xzf /tmp/server.tgz -C /var/www/english-study-server
            rm /tmp/server.tgz
            cd /var/www/english-study-server
            npm install --omit=dev
            pm2 restart english-study-server || pm2 start npm --name english-study-server -- run start --workspace apps/server
            pm2 save
